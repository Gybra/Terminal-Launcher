name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, verify coverage, lint, and build
        run: ./gradlew testDebugUnitTest koverVerifyDebug lintDebug assembleDebug --stacktrace

      - name: Verify launcher registration
        run: |
          apkanalyzer manifest print app/build/outputs/apk/debug/app-debug.apk > merged-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse("merged-manifest.xml").getroot()
          required_categories = {
              "android.intent.category.HOME",
              "android.intent.category.DEFAULT",
          }

          for activity in root.findall("./application/activity"):
              if activity.get(f"{android}exported") != "true":
                  continue
              for intent_filter in activity.findall("intent-filter"):
                  actions = {
                      action.get(f"{android}name")
                      for action in intent_filter.findall("action")
                  }
                  categories = {
                      category.get(f"{android}name")
                      for category in intent_filter.findall("category")
                  }
                  if (
                      "android.intent.action.MAIN" in actions
                      and required_categories <= categories
                  ):
                      raise SystemExit(0)

          raise SystemExit("No exported HOME launcher activity found")
          PY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
